name: Weekly Mass Schedule Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * 1' # 6:15 AM EST / 7:15 AM EDT (UTC schedule)
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check official parish websites
        run: python check_schedules.py
      - name: Save monitoring baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshots.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update parish website monitoring baseline'
            git push
          fi
      - name: Upload monitoring report
        uses: actions/upload-artifact@v4
        with:
          name: parish-monitoring-report
          path: report.md
